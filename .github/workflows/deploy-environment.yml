name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      version:
        required: true
        type: string
      deploy_path:
        required: true
        type: string
      health_url:
        required: true
        type: string

env:
  IMAGE: ghcr.io/coding-factory-projects/codaemon

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ansible and SOPS
        run: |
          pip install ansible-core==2.21.5
          ansible-galaxy collection install -r ansible/requirements.yml
          version=3.13.3
          base="https://github.com/getsops/sops/releases/download/v${version}"
          binary="sops-v${version}.linux.amd64"
          curl --fail --silent --show-error --location "$base/$binary" --output "$binary"
          curl --fail --silent --show-error --location "$base/sops-v${version}.checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          sudo install -m 0755 "$binary" /usr/local/bin/sops
          rm "$binary" checksums.txt
      - name: Render .env from SOPS
        run: |
          ansible-playbook --connection=local --inventory localhost, \
            --extra-vars "deploy_env=$DEPLOY_ENV" \
            --extra-vars "env_output_path=$GITHUB_WORKSPACE/.env" \
            --extra-vars "project_version=$PROJECT_VERSION image_tag=$IMAGE_TAG" \
            --tags deploy ansible/site.yml
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DEPLOY_ENV: ${{ inputs.environment }}
          PROJECT_VERSION: ${{ inputs.version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
      - name: Copy compose + env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: "docker-compose.yml,.env"
          target: ${{ inputs.deploy_path }}
      - name: Copy int fixture to server
        if: inputs.environment == 'int'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: "fixtures/students.example.json"
          target: ${{ inputs.deploy_path }}
      - name: Pull & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -e
            cd ${{ inputs.deploy_path }}
            if [ '${{ inputs.environment }}' = 'int' ]; then
              cp fixtures/students.example.json fixtures/students.json
            fi
            docker compose up -d --pull always --remove-orphans
            docker image ls ${{ env.IMAGE }} --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':${{ inputs.image_tag }}$' \
              | grep -v ':${{ inputs.version }}$' \
              | grep -v ':latest$' \
              | xargs -r docker image rm || true
            docker image prune -f
      - name: Verify deployment
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors \
            '${{ inputs.health_url }}' \
            | jq --exit-status \
              --arg version '${{ inputs.version }}' \
              '.status == "ok" and .version == $version'
      - name: Remove rendered secrets
        if: always()
        run: rm -f .env
