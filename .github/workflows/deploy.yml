name: Deploy integration

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/coding-factory-projects/codaemon

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Check
        run: |
          make lint
          make check
          uv run pytest
      - name: Compute version
        id: version
        run: |
          release=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${release}-$(git rev-parse --short=6 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: PROJECT_VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-int:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      environment: int
      image_tag: ${{ needs.build.outputs.image_tag }}
      version: ${{ needs.build.outputs.version }}
      config_path: .github/environments/int.env
      deploy_path: /srv/codaemon-int
      health_url: https://codaemon-int.codingfactory.tech/healthz
