[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codaemon"
version = "2026.01"
description = "Discord bot that manages the Coding Factory school server"
requires-python = ">=3.13"
dependencies = [
    "django==6.0.8",
    "django-environ>=0.14",
    "discord.py>=2.7.1",
    "httpx>=0.28.1",
    "gunicorn>=26",
    "whitenoise>=6.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-django>=4.9",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py", "*_test.py"]
